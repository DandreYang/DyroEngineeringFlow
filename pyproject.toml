[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dyro"
version = "0.6.7"
description = "DyroEngineeringFlow: local-first automation and delivery control for multi-repository teams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44.0.0",
  "rfc8785>=0.1.4",
]
authors = [{ name = "DandreYang" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agent", "automation", "delivery", "git-worktree", "multi-repository"]
classifiers = [
  "Development Status :: 4 - Beta",
    "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/DandreYang/DyroEngineeringFlow"
Repository = "https://github.com/DandreYang/DyroEngineeringFlow"
Issues = "https://github.com/DandreYang/DyroEngineeringFlow/issues"
Changelog = "https://github.com/DandreYang/DyroEngineeringFlow/blob/main/CHANGELOG.md"

[project.scripts]
dyro = "dyro.cli:main"

[project.optional-dependencies]
dev = ["build==1.3.0", "ruff==0.15.2", "twine==6.2.0"]

# Core lives under src/; the optional local dispatch harness ships as an
# importable package and via `dyro dispatch`.
[tool.setuptools.package-dir]
"" = "src"
"experiments" = "experiments"

[tool.setuptools]
packages = [
  "dyro",
  "dyro.console",
  "dyro.console.assets",
  "dyro.continuation",
  "dyro.integrations",
  "dyro.integrations.assets",
  "experiments",
  "experiments.local_agent_dispatch",
  "experiments.local_agent_dispatch.adapters",
]

[tool.setuptools.package-data]
"dyro.console" = ["assets/*"]
"dyro.integrations" = [
  "assets/dyro-control-plane/SKILL.md",
  "assets/dyro-control-plane/agents/openai.yaml",
]

[tool.unittest]
start-directory = "tests"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dyro"
version = "0.4.1"
description = "DyroEngineeringFlow: local-first automation and delivery control for multi-repository teams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44.0.0",
  "rfc8785>=0.1.4",
]
authors = [{ name = "DandreYang" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agent", "automation", "delivery", "git-worktree", "multi-repository"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/DandreYang/DyroEngineeringFlow"
Repository = "https://github.com/DandreYang/DyroEngineeringFlow"
Issues = "https://github.com/DandreYang/DyroEngineeringFlow/issues"
Changelog = "https://github.com/DandreYang/DyroEngineeringFlow/blob/main/CHANGELOG.md"

[project.scripts]
dyro = "dyro.cli:main"

[project.optional-dependencies]
dev = ["ruff==0.15.2"]

# Core lives under src/; first-party experiments ship in the same wheel as
# importable packages (experiments.*) and via `dyro dispatch` for L0–L4.
[tool.setuptools.package-dir]
"" = "src"
"experiments" = "experiments"

[tool.setuptools]
packages = [
  "dyro",
  "experiments",
  "experiments.local_agent_dispatch",
  "experiments.local_agent_dispatch.adapters",
  "experiments.external_workflow_runner",
  "experiments.external_workflow_runner.stage1",
  "experiments.external_workflow_runner.stage2",
  "experiments.external_workflow_runner.stage3",
  "experiments.external_workflow_runner.stage4",
  "experiments.external_workflow_runner.stage5",
]

[tool.setuptools.package-data]
"experiments.external_workflow_runner" = [
  "runtime-lock.json",
  "schemas/*.json",
  "fixtures/*",
]

[tool.unittest]
start-directory = "tests"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

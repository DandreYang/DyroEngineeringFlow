name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install locked project
        run: uv sync --locked --all-extras --dev

      - name: Lint
        run: uv run ruff check src tests experiments

      - name: Run tests
        run: uv run python -m unittest discover -s tests -t . -v

      - name: Compile source
        run: uv run python -m compileall -q src tests experiments

  wheel-smoke:
    name: Wheel/sdist install smoke (dispatch/runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Build and verify installed wheel and sdist
        run: |
          set -euo pipefail
          python -m pip install -U pip build setuptools wheel
          python -m build -o /tmp/dyro-dist
          smoke_root="$(mktemp -d)"
          cd "$smoke_root"
          python -m venv /tmp/dyro-wheel-venv
          /tmp/dyro-wheel-venv/bin/pip install /tmp/dyro-dist/dyro-*.whl
          /tmp/dyro-wheel-venv/bin/python "$GITHUB_WORKSPACE/tools/verify_installed_artifact.py"
          /tmp/dyro-wheel-venv/bin/python -c "import experiments.local_agent_dispatch, experiments.external_workflow_runner"
          DYRO_LOCAL_AGENT_DISPATCH_HOME="$smoke_root/wheel-dispatch-home" /tmp/dyro-wheel-venv/bin/dyro dispatch doctor >/tmp/dispatch-doctor.json
          python -c "import json; json.load(open('/tmp/dispatch-doctor.json'))"
          set +e
          DYRO_LOCAL_AGENT_DISPATCH_HOME="$smoke_root/wheel-dispatch-home" /tmp/dyro-wheel-venv/bin/dyro runtime production-gate >/tmp/runtime-gate.json
          runtime_gate_exit=$?
          set -e
          test "$runtime_gate_exit" -eq 3
          python -c "import json; r=json.load(open('/tmp/runtime-gate.json')); assert r.get('verdict')=='NOT_READY' and r.get('exit_code')==3, r"
          /tmp/dyro-wheel-venv/bin/dyro runtime production-acceptance schemas >/tmp/runtime-schemas.json
          python -c "import json, pathlib; r=json.load(open('/tmp/runtime-schemas.json')); assert r.get('verdict')=='LOCATED' and all(pathlib.Path(v['path']).is_file() for v in r['schemas'].values()), r"
          python -m venv /tmp/dyro-sdist-venv
          /tmp/dyro-sdist-venv/bin/pip install /tmp/dyro-dist/dyro-*.tar.gz
          /tmp/dyro-sdist-venv/bin/python "$GITHUB_WORKSPACE/tools/verify_installed_artifact.py"
          /tmp/dyro-sdist-venv/bin/python -c "import experiments.local_agent_dispatch, experiments.external_workflow_runner"
          DYRO_LOCAL_AGENT_DISPATCH_HOME="$smoke_root/sdist-dispatch-home" /tmp/dyro-sdist-venv/bin/dyro dispatch doctor >/tmp/dispatch-doctor-sdist.json
          python -c "import json; json.load(open('/tmp/dispatch-doctor-sdist.json'))"
          set +e
          DYRO_LOCAL_AGENT_DISPATCH_HOME="$smoke_root/sdist-dispatch-home" /tmp/dyro-sdist-venv/bin/dyro runtime production-gate >/tmp/runtime-gate-sdist.json
          runtime_gate_sdist_exit=$?
          set -e
          test "$runtime_gate_sdist_exit" -eq 3
          python -c "import json; r=json.load(open('/tmp/runtime-gate-sdist.json')); assert r.get('verdict')=='NOT_READY' and r.get('exit_code')==3, r"
          /tmp/dyro-sdist-venv/bin/dyro runtime production-acceptance schemas >/tmp/runtime-schemas-sdist.json
          python -c "import json, pathlib; r=json.load(open('/tmp/runtime-schemas-sdist.json')); assert r.get('verdict')=='LOCATED' and all(pathlib.Path(v['path']).is_file() for v in r['schemas'].values()), r"

  windows-dispatch-import:
    name: Windows dispatch import / fail-closed smoke
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install .

      - name: Verify import and fail-closed execution
        run: |
          python -m experiments.local_agent_dispatch --dry-run doctor
          python tools/verify_windows_dispatch_import.py

  external-workflow-isolation:
    name: External workflow Docker isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked project
        run: uv sync --locked --all-extras --dev

      - name: Pull Stage0/1 runtime image from lock
        run: |
          set -euo pipefail
          image="$(uv run python -c "import json; from pathlib import Path; print(json.loads(Path('experiments/external_workflow_runner/runtime-lock.json').read_text())['runtime']['container_image'])")"
          echo "Pulling pinned image: ${image}"
          docker pull "${image}"
          docker image inspect "${image}" >/dev/null

      - name: Run Stage0 tests with Docker isolation
        run: |
          set -euo pipefail
          # Fail the job if any Stage0 Docker test is still skipped for a missing image.
          uv run python -m unittest tests.test_external_workflow_runner_stage0 -v 2>&1 | tee /tmp/stage0-tests.log
          if grep -F "skipped 'requires local image" /tmp/stage0-tests.log; then
            echo "Stage0 Docker tests were skipped; isolation was not exercised." >&2
            exit 1
          fi
          if ! grep -E '^OK( |$)' /tmp/stage0-tests.log; then
            echo "Stage0 unittest did not report OK." >&2
            exit 1
          fi

      - name: Run Stage1 tests with Docker isolation
        run: |
          set -euo pipefail
          uv run python -m unittest tests.test_external_workflow_runner_stage1 -v 2>&1 | tee /tmp/stage1-tests.log
          if grep -F "skipped 'requires local image" /tmp/stage1-tests.log; then
            echo "Stage1 Docker tests were skipped; isolation was not exercised." >&2
            exit 1
          fi
          if grep -E '^(FAILED|ERROR:)' /tmp/stage1-tests.log; then
            echo "Stage1 tests reported failures." >&2
            exit 1
          fi
          if ! grep -E '^OK( |$)' /tmp/stage1-tests.log; then
            echo "Stage1 unittest did not report OK." >&2
            exit 1
          fi

      - name: Run Stage2 tests with Docker isolation
        run: |
          set -euo pipefail
          uv run python -m unittest tests.test_external_workflow_runner_stage2 -v 2>&1 | tee /tmp/stage2-tests.log
          if grep -F "skipped 'requires local image" /tmp/stage2-tests.log; then
            echo "Stage2 Docker tests were skipped; isolation was not exercised." >&2
            exit 1
          fi
          if grep -E '^(FAILED|ERROR:)' /tmp/stage2-tests.log; then
            echo "Stage2 tests reported failures." >&2
            exit 1
          fi
          if ! grep -E '^OK( |$)' /tmp/stage2-tests.log; then
            echo "Stage2 unittest did not report OK." >&2
            exit 1
          fi

      - name: Run Stage3 tests with Docker isolation
        run: |
          set -euo pipefail
          uv run python -m unittest tests.test_external_workflow_runner_stage3 -v 2>&1 | tee /tmp/stage3-tests.log
          if grep -F "skipped 'requires local image" /tmp/stage3-tests.log; then
            echo "Stage3 Docker tests were skipped; isolation was not exercised." >&2
            exit 1
          fi
          if grep -E '^(FAILED|ERROR:)' /tmp/stage3-tests.log; then
            echo "Stage3 tests reported failures." >&2
            exit 1
          fi
          if ! grep -E '^OK( |$)' /tmp/stage3-tests.log; then
            echo "Stage3 unittest did not report OK." >&2
            exit 1
          fi

      - name: Run Stage4 tests with Docker isolation
        run: |
          set -euo pipefail
          uv run python -m unittest tests.test_external_workflow_runner_stage4 -v 2>&1 | tee /tmp/stage4-tests.log
          if grep -F "skipped 'requires local image" /tmp/stage4-tests.log; then
            echo "Stage4 Docker tests were skipped; isolation was not exercised." >&2
            exit 1
          fi
          if grep -E '^(FAILED|ERROR:)' /tmp/stage4-tests.log; then
            echo "Stage4 tests reported failures." >&2
            exit 1
          fi
          if ! grep -E '^OK( |$)' /tmp/stage4-tests.log; then
            echo "Stage4 unittest did not report OK." >&2
            exit 1
          fi

      - name: Run Stage5 tests with Docker isolation
        run: |
          set -euo pipefail
          uv run python -m unittest tests.test_external_workflow_runner_stage5 -v 2>&1 | tee /tmp/stage5-tests.log
          if grep -F "skipped 'requires local image" /tmp/stage5-tests.log; then
            echo "Stage5 Docker tests were skipped; isolation was not exercised." >&2
            exit 1
          fi
          if grep -E '^(FAILED|ERROR:)' /tmp/stage5-tests.log; then
            echo "Stage5 tests reported failures." >&2
            exit 1
          fi
          if ! grep -E '^OK( |$)' /tmp/stage5-tests.log; then
            echo "Stage5 unittest did not report OK." >&2
            exit 1
          fi

      - name: Verify no residual experiment containers
        if: always()
        run: |
          set -euo pipefail
          leftover="$(docker ps --all --filter name=dyro-stage0 --filter name=dyro-s1 --filter name=dyro-s2 --filter name=dyro-s3 --filter name=dyro-s4 --filter name=dyro-s5 --filter name=dyro-stage1 --filter name=dyro-stage2 --filter name=dyro-stage3 --filter name=dyro-stage4 --filter name=dyro-stage5 --format '{{.Names}} {{.Status}}' || true)"
          if [[ -n "${leftover}" ]]; then
            echo "Residual experiment containers found:" >&2
            echo "${leftover}" >&2
            docker ps --all --filter name=dyro-stage0 --filter name=dyro-s1 --filter name=dyro-s2 --filter name=dyro-s3 --filter name=dyro-s4 --filter name=dyro-s5 --filter name=dyro-stage1 --filter name=dyro-stage2 --filter name=dyro-stage3 --filter name=dyro-stage4 --filter name=dyro-stage5
            exit 1
          fi
          echo "No dyro-stage residual containers remain."

  typescript-interop:
    name: TypeScript protocol interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install locked reference runner
        run: npm ci
        working-directory: examples/typescript-runner

      - name: Verify TypeScript interoperability
        run: npm test
        working-directory: examples/typescript-runner

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install locked project
        run: uv sync --locked --all-extras --dev

      - name: Lint
        run: uv run ruff check src tests experiments

      - name: Run tests
        run: uv run python -m unittest discover -s tests -t . -v

      - name: Compile source
        run: uv run python -m compileall -q src tests experiments

  wheel-smoke:
    name: Wheel/sdist install smoke (dispatch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Build and verify installed wheel and sdist
        run: |
          set -euo pipefail
          python -m pip install -U pip build setuptools wheel
          python -m build -o /tmp/dyro-dist
          smoke_root="$(mktemp -d)"
          cd "$smoke_root"
          python -m venv /tmp/dyro-wheel-venv
          /tmp/dyro-wheel-venv/bin/pip install /tmp/dyro-dist/dyro-*.whl
          /tmp/dyro-wheel-venv/bin/python -c "import experiments.local_agent_dispatch"
          DYRO_LOCAL_AGENT_DISPATCH_HOME="$smoke_root/wheel-dispatch-home" /tmp/dyro-wheel-venv/bin/dyro dispatch doctor >/tmp/dispatch-doctor.json

  windows-dispatch-import:
    name: Windows dispatch import / fail-closed smoke
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install .

      - name: Verify import and fail-closed execution
        run: |
          python -m experiments.local_agent_dispatch --dry-run doctor
          python tools/verify_windows_dispatch_import.py

  typescript-interop:
    name: TypeScript protocol interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install locked reference runner
        run: npm ci
        working-directory: examples/typescript-runner

      - name: Verify TypeScript interoperability
        run: npm test
        working-directory: examples/typescript-runner
